<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#2d4f70">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Shift Hourly Report</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1c2230;--mut:#6b7385;--line:#dde1ea;--acc:#2d4f70;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f2a;--ink:#e8ebf2;--mut:#9aa3b5;--line:#2c3342;--acc:#6f9fd0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px}
h1{font-size:17px;margin:0 0 8px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{flex:1;min-width:0}
.ib{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.ib[hidden]{display:none}
.syncst{font-size:11px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap}
.syncst[hidden]{display:none}
.syncwrap{position:fixed;inset:0;background:rgba(8,12,20,.6);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:56px 12px 12px}
.syncwrap[hidden]{display:none}
.syncbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:430px;box-shadow:0 14px 44px rgba(0,0,0,.3)}
.sbh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sbh button{background:transparent;border:0;color:var(--mut);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.sl{display:block;font-size:12px;color:var(--mut);margin:9px 0}
.sl textarea,.sl input{width:100%;margin-top:4px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.srow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:14px;font-weight:600}
.tabs button small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button.on small{color:#dbe7f3}
main{padding:12px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar b{font-size:17px}
.bar label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.cp{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px}
.cp.ok{background:#2e7d32}
.scroll{overflow-x:auto;padding:10px}
.hint{font-size:12px;color:var(--mut);padding:0 12px 10px}
.clr{display:block;width:100%;padding:12px;margin:4px 0 24px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:10px;font-size:13px}
.exp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--mut)}
.exp span{font-weight:600;color:var(--ink);margin-right:4px}
.exp button{padding:8px 12px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:9px;font-size:13px;font-weight:600}
.sz{font:inherit;font-size:13px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.bar{flex-wrap:wrap}
.shf{margin:0 0 14px;font-size:13px;color:var(--mut)}
.shf .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.shf label{display:block}
.shf input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:90px}
.shf input[data-f=col]{width:150px}
details.rnd{margin:-2px 0 12px;font-size:13px;color:var(--mut)}
details.rnd summary{padding:6px 0;cursor:pointer}
.ctl input[type=number]{width:70px}
#sum h2{font-size:16px;margin:22px 0 10px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--mut)}
.ctl label{display:flex;align-items:center;gap:6px}
.ctl input,.ctl select{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.zb button{padding:7px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:12px;margin-right:4px}
.zb button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sc2{overflow-x:auto;padding:10px}
td.dv{cursor:default}
td.ex{background-image:linear-gradient(rgba(45,79,112,.10),rgba(45,79,112,.10))}
td.ex:focus{outline:3px solid #3b82f6;outline-offset:-3px}
.sj{flex:.7!important;background:transparent!important}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.s{opacity:1}
</style>
</head>
<body>
<header>
<div class="hrow"><h1>Shift Hourly Report <span id="sv" style="font-size:12px;font-weight:400;color:var(--mut);margin-left:6px"></span></h1><button id="install" class="ib" type="button" hidden>Install app</button><button id="syncBtn" class="ib" type="button">Sync</button><span id="syncSt" class="syncst" hidden></span></div>

<script>
var SH={A:[9,10,11,12,13,14,15],B:[17,18,19,20,21,22,23],C:[1,2,3,4,5,6,7]};
var MEM={},LOK=false,DBOK=false,DBD=null,TSK='shiftrep_ts',DIRTY=false,DT=null;
function sget(k){try{var v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return MEM[k]===undefined?null:MEM[k]}
function sset(k,v){MEM[k]=v;DIRTY=true;try{localStorage.setItem(k,v);LOK=true}catch(e){}MEM[TSK]=String(Date.now());try{localStorage.setItem(TSK,MEM[TSK])}catch(e){}schedDb()}

(function(){try{
 var cl=window.claude;if(!cl||!cl.use)return;

  var db=r[0],u=r[1];if(!db||!u)return;

   if(!id)return;DBD=db.doc('data/users/'+id+'/state');
   return DBD.get().then(function(sn){
    var lt=+(sget(TSK)||0);
    if(sn.exists){var d=sn.data()||{};
     if((d.ts||0)>lt){MEM[KEY]=d.v;MEM[XK]=d.x;MEM[TSK]=String(d.ts);try{localStorage.setItem(KEY,d.v);localStorage.setItem(XK,d.x);localStorage.setItem(TSK,String(d.ts))}catch(e){}
      if(!DIRTY&&typeof build==='function'&&document.getElementById('main'))build(CUR);DBOK=true;setStatus();return}
    }
    pushDb();
   });
  });
 }).catch(function(){});
}catch(e){}})();

 var h='<table cellspacing="0" cellpadding="0" border="0" width="'+W+'" style="border-collapse:collapse;table-layout:fixed;width:'+W+'px;margin:0 0 24px 0"><tr><td colspan="'+n+'" height="'+sp.th+'" bgcolor="'+bg+'" align="center" style="'+BD+'background-color:'+bg+';color:#ffffff;'+f+'font-size:'+sp.tf+'px;height:'+sp.th+'px;padding:0 2px"><font color="#ffffff">'+title+'</font></td></tr><tr>';
 heads.forEach(function(x,i){h+='<td width="'+cols[i]+'" height="'+sp.hh+'" bgcolor="'+bg+'" align="center" style="'+BD+'width:'+cols[i]+'px;height:'+sp.hh+'px;background-color:'+bg+';color:#ffffff;'+f+'font-size:'+sp.hf+'px;white-space:'+(sp.wrap?'normal':'nowrap')+';padding:0 2px"><font color="#ffffff">'+x+'</font></td>'});
 h+='</tr><tr>';
 vals.forEach(function(v,i){h+='<td contenteditable="true" width="'+cols[i]+'" height="'+sp.vh+'" bgcolor="#111111" align="center" style="'+BD+'width:'+cols[i]+'px;height:'+sp.vh+'px;background-color:#111111;color:#ffffff;'+f+'font-size:'+sp.vf+'px;white-space:nowrap;padding:0 2px">'+(v||'&nbsp;')+'</td>'});
 return h+'</tr></table>';
}
var SP1={cols:[118,88,74],tf:16,th:27,hf:15,hh:28,vf:24,vh:44};
var SP2={cols:[118,88,74,80,118],tf:18,th:34,hf:19,hh:62,vf:19,vh:35,wrap:1};
var SP3={cols:[80,80,100,88],tf:18,th:32,hf:20,hh:32,vf:17,vh:43};
function t1(){return tbl('Reactor','#006400',SP1,['Mois%','FFA%','FA%'],['','N/A',''])}
function t2(){return tbl('Plodder','#574967',SP2,['Moisture %','FFA%','FA%','Y+5R','Capacity'],['','N/A','','',''])}
var COLDEF='0.2 R / 1.1Y';
function shf(){var o=xs().sh||{};function i(f,l,ph,dv){var v=(o[f]!==undefined&&o[f]!==null&&o[f]!=='')?o[f]:(dv||'');return '<label>'+l+'<br><input data-f="'+f+'" inputmode="decimal" placeholder="'+ph+'" value="'+esc(v)+'"></label>'}
 return '<div class="shf nocopy">Shift analyses \u2013 type once, used for both samples (not copied)<div class="row">'+i('iv','IV','42.2')+i('ti','Titre','45.5')+i('col','Color',COLDEF,COLDEF)+'</div></div>'}
function t3c(card,time){return (card._samp&&time===card._time?shf():'')+t3(time)}
function t3(time){return tbl('Plodder ('+time+')','#2d4f70',SP3,['CL %','Gly%','EDTA%','TFM'],['','','',''])}
function cellTxt(x){return x.textContent.replace(/\u00a0/g,'').trim()}
function load(){try{return JSON.parse(sget(KEY))||{}}catch(e){return {}}}
function saveAll(){
 try{
  autoTfmCards();var all=load();var o={};
  [].forEach.call(document.querySelectorAll('.card'),function(c){
   var ck=c.querySelector('.ck');if(!ck)return;
   var v=[];[].forEach.call(c.querySelectorAll('.blk td[contenteditable]'),function(x){v.push(cellTxt(x))});
   o[c._h]={ck:ck.checked,t3:c._t3||'',v:v,tm:c._tm?1:0};
  });
  all[CUR]=o;sset(KEY,JSON.stringify(all));
  setStatus();
 }catch(e){setStatus()}
 renderSummary();
}
function fillCells(card,v){
 var cells=card.querySelectorAll('.blk td[contenteditable]');
 for(var i=0;i<cells.length&&i<v.length;i++){cells[i].innerHTML=v[i]?v[i].replace(/</g,'&lt;'):'&nbsp;'}
}
function build(key){
 CUR=key;var m=document.getElementById('main');m.innerHTML='';m.appendChild(expBar());
 var hrs=SH[key],saved=load()[key]||{};
 hrs.forEach(function(h,i){
  var samp=(i===0||i===3),sv=saved[h];
  var card=document.createElement('div');card.className='card';card._h=h;card._samp=samp;card._time=pad(h);
  card.innerHTML='<div class="bar"><b>'+pad(h)+'</b><label><input type="checkbox" class="ck"> '+(samp?'Plodder table':'Add last Plodder table')+'</label><select class="sz" title="Size of the copied tables"><option value="std">Standard</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option></select><button class="cp">Copy</button></div>'
   +'<div class="scroll"><div class="blk" style="padding:4px;font-family:Times New Roman,serif;width:460px"><div style="color:#4472c4;font-weight:bold;font-size:19px;font-family:Times New Roman,serif;margin:0 0 14px 0">'+pad(h)+'</div>'+t1()+t2()+'<div class="slot"></div></div></div><div class="hint calc"></div>';
  m.appendChild(card);
  var slot=card.querySelector('.slot'),ck=card.querySelector('.ck');
  var on=sv?sv.ck:samp;
  if(on){ck.checked=true;card._t3=(sv&&sv.t3)||pad(h);slot.innerHTML=t3c(card,card._t3)}
  if(sv){fillCells(card,sv.v);card._tm=!!sv.tm}
  ck.onchange=function(){
   if(!ck.checked){slot.innerHTML='';card._t3='';saveAll();return}
   var src=null;
   if(!samp){var cards=[].slice.call(document.querySelectorAll('.card'));
    for(var j=cards.indexOf(card)-1;j>=0;j--){if(cards[j]._samp){src=cards[j];break}}}
   card._t3=src?src._time:pad(h);
   slot.innerHTML=t3c(card,card._t3);
   if(src){var sc=src.querySelectorAll('.slot td[contenteditable]'),dc=slot.querySelectorAll('td[contenteditable]');
    for(var k=0;k<dc.length&&k<sc.length;k++){var t=cellTxt(sc[k]);dc[k].innerHTML=t||'&nbsp;'}}
   saveAll();
  };
  card.querySelector('.cp').onclick=function(e){copyBlk(card.querySelector('.blk'),e.target)};
 });
 applySize();
 buildSummary(m);
 var cl=document.createElement('button');cl.className='clr';cl.textContent='Clear all values in this shift';
 var armed=false;
 cl.onclick=function(){
  if(!armed){armed=true;cl.textContent='Tap again to confirm clear';setTimeout(function(){armed=false;cl.textContent='Clear all values in this shift'},3000);return}
  try{var all=load();delete all[CUR];sset(KEY,JSON.stringify(all));var XX=loadX();delete XX[CUR];sset(XK,JSON.stringify(XX))}catch(e){}
  build(CUR);toast('Shift cleared');
 };
 m.appendChild(cl);
 window.scrollTo(0,0);
}
document.addEventListener('focusin',function(e){var t=e.target;if(t.matches&&t.matches('td[contenteditable]')&&!t.closest('#sum')&&cellTxt(t)===''){t.innerHTML=''}});
document.addEventListener('focusout',function(e){var t=e.target;if(t.matches&&t.matches('td[contenteditable]')&&!t.closest('#sum')&&cellTxt(t)===''){t.innerHTML='&nbsp;'}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.matches&&t.matches('.shf input')){var f=t.getAttribute('data-f');[].forEach.call(document.querySelectorAll('.shf input[data-f="'+f+'"]'),function(x){if(x!==t)x.value=t.value});putX(function(o){o.sh=o.sh||{};o.sh[f]=t.value});renderSummary();return}if(t.matches&&t.matches('td[contenteditable]')){
 if(t.closest('#sum')){t.removeAttribute('data-auto');saveExtras()}
 else{var c=t.closest('.card');if(c){var cs=c.querySelectorAll('.blk td[contenteditable]');if(cs.length>=12&&cs[11]===t)c._tm=cellTxt(t)!==''}saveAll()}}});
document.addEventListener('keydown',function(e){var t=e.target;if(e.key==='Enter'&&t.matches&&t.matches('td[contenteditable]')){e.preventDefault();t.blur()}});
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='s';setTimeout(function(){e.className=''},1600)}
function sizeF(){var v=xs().size||'std';return v==='std'?1:(+v/100*1.6)}
function scaleHtml(h,f){if(f===1)return h;
 return h.replace(/(width|height|font-size)\s*:\s*(\d+(?:\.\d+)?)px/g,function(m,p,v){return p+':'+Math.max(1,Math.round(v*f*10)/10)+'px'})
  .replace(/(\s(?:width|height)=")(\d+(?:\.\d+)?)(")/g,function(m,a,v,b){return a+Math.max(1,Math.round(v*f))+b})}
function applySize(){var v=xs().size||'std',f=sizeF();
 [].forEach.call(document.querySelectorAll('.sz'),function(x){x.value=v});
 [].forEach.call(document.querySelectorAll('.card .scroll'),function(x){x.style.zoom=f})}
document.addEventListener('change',function(e){var t=e.target;if(t.classList&&t.classList.contains('sz')){putX(function(o){o.size=t.value});applySize()}});
function copyBlk(blk,btn){
 var c=blk.cloneNode(true);
 [].forEach.call(c.querySelectorAll('.nocopy'),function(x){x.parentNode.removeChild(x)});
 c.querySelectorAll('[contenteditable]').forEach(function(x){x.removeAttribute('contenteditable')});
 c.style.width='';
 var nc=blk.querySelectorAll('.nocopy');[].forEach.call(nc,function(x){x.style.display='none'});
 var txt=blk.innerText;[].forEach.call(nc,function(x){x.style.display=''});
 copyOut(scaleHtml(c.outerHTML,sizeF()),txt,btn);
}
function copyOut(html,txt,btn){
 function done(){btn.textContent='Copied \u2713';btn.classList.add('ok');toast('Copied \u2013 paste in Outlook');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('ok')},1800)}
 function fb(){
  var d=document.createElement('div');d.innerHTML=html;d.style.cssText='position:fixed;left:0;top:0;opacity:0';
  document.body.appendChild(d);var r=document.createRange();r.selectNodeContents(d);
  var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  try{document.execCommand('copy');done()}catch(e){toast('Copy failed')}
  s.removeAllRanges();document.body.removeChild(d);
 }
 try{
  if(navigator.clipboard&&window.ClipboardItem){
   navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(done,fb);
  }else fb();
 }catch(e){fb()}
}
var XK='shiftrep_x1';
var RCOLS=[['B',379],['C',126],['D',219],['E',287],['F',224],['G',140],['H',96],['I',156],['J',140],['K',96],['L',96],['M',96],['N',96],['O',96],['P',184],['Q',116],['R',404],['S',325]].map(function(a){return{k:a[0],w:a[1]}});
var PCOLS=[['B',113],['C',88],['D',83],['E',112],['F',74],['G',46],['H',65],['I',70],['J',76],['K',62],['L',44],['M',58],['N',58],['O',73],['P',128],['Q',66],['R',133]].map(function(a){return{k:a[0],w:a[1]}});
function prng(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}var a=h>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rnd(X,h){var sh=X.sh||{},tol=parseFloat((X.rb||{}).tol);if(isNaN(tol))tol=0.1;
 var R=prng(CUR+'|'+(X.date||todayISO())+'|'+h+'|'+(X.seed||0));
 function j(v,dec){var b=parseFloat(v);if(isNaN(b))return '';return (b+(R()*2-1)*tol).toFixed(dec)}
 return{iv:j(sh.iv,2),ti:j(sh.ti,1),col:String(sh.col||COLDEF).trim()}}
function sumW(a){var t=0;a.forEach(function(c){t+=c.w});return t}
var SHC={A:'#92CDDC',B:'#FAC090',C:'#E6B9B8'};
var RED_EX=['E','F','J','K','L','M','N','O','P','Q','R','S'],PL_EX=['E','L','N','O','P','Q','R'];
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function loadX(){try{return JSON.parse(sget(XK))||{}}catch(e){return {}}}
function xs(){return loadX()[CUR]||{}}
function putX(fn){try{var X=loadX(),o=X[CUR]||{};fn(o);X[CUR]=o;sset(XK,JSON.stringify(X))}catch(e){}}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dtxt(iso,fmt){var p=(iso||todayISO()).split('-');return fmt==='mdy'?p[1]+'-'+p[2]+'-'+p[0]:p[2]+'-'+p[1]+'-'+p[0]}
function hourData(){var out=[];[].forEach.call(document.querySelectorAll('.card'),function(c){if(c._h==null)return;var a=[].map.call(c.querySelectorAll('.blk td[contenteditable]'),cellTxt);var own=!!(c._samp&&c.querySelector('.ck').checked&&c._t3===c._time&&a.length>=12);out.push({h:c._h,own:own,a:a,c:c})});return out}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n}
function vals(kind,d,X){

tabs.children[0].click();

<script>
/* ---------------- optional cloud sync (phone <-> PC) ----------------
   The app keeps working exactly as before if no sync code is set.
   Data is stored in a tiny JSON document per shift and merged by timestamp,
   so two devices can both work without overwriting each other.
   Setting a PIN encrypts the cloud copy (AES-GCM + PBKDF2).               */
var SYNC={code:'',pin:'',salt:'',ts:{},last:0,state:'off',applying:false};
var DEFCODE='https://soap-lab-shift-sync-default-rtdb.europe-west1.firebasedatabase.app/lab/shift-40266e02ffb7ac507bcc846a.json';
var DEFPIN='2780';
function sRead(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function sWrite(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function syncLoad(){
 try{
  SYNC.code=sRead('shiftrep_sync_code','');
  var _p=sRead('shiftrep_sync_pin',null);
  SYNC.pin=(_p===null?DEFPIN:_p);
  SYNC.salt=sRead('shiftrep_sync_salt','');
  SYNC.ts=JSON.parse(sRead('shiftrep_sync_ts','{}'))||{};
 }catch(e){}
}
function syncPersist(){
 sWrite('shiftrep_sync_code',SYNC.code);sWrite('shiftrep_sync_pin',SYNC.pin);
 sWrite('shiftrep_sync_salt',SYNC.salt);sWrite('shiftrep_sync_ts',JSON.stringify(SYNC.ts));
}
function syncCfg(){
 if(!SYNC.pin)return null;
 var c=(SYNC.code||DEFCODE||'').trim();if(!c)return null;
 var i=c.indexOf('|'),url=(i<0?c:c.slice(0,i)).trim(),key=(i<0?'':c.slice(i+1).trim());
 var h={};if(key)h['X-Master-Key']=key;
 return {url:url,headers:h};
}
function b64(b){var s='',i;for(i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function syncCryptoOk(){return !!(window.crypto&&window.crypto.subtle)}
async function syncKey(saltB64){
 if(!SYNC.pin)return null;
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(SYNC.pin),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function syncPayload(){
 var v1=load(),x1=loadX(),shifts={};
 ['A','B','C'].forEach(function(k){shifts[k]={d:v1[k]||{},x:x1[k]||{},ts:SYNC.ts[k]||0}});
 return {v:1,ts:Date.now(),shifts:shifts};
}
function syncApply(k,rem){
 var v1=load(),x1=loadX();
 v1[k]=rem.d||{};x1[k]=rem.x||{};
 SYNC.applying=true;
 try{sset(KEY,JSON.stringify(v1));sset(XK,JSON.stringify(x1));}finally{SYNC.applying=false;}
}
function syncStatus(msg){
 var el=document.getElementById('syncSt');if(!el)return;
 el.hidden=!SYNC.pin;
 if(msg)el.textContent=msg;
 var t=new Date(SYNC.last);
 el.textContent=SYNC.state==='ok'?('Synced '+(t.getHours()<10?'0':'')+t.getHours()+':'+(t.getMinutes()<10?'0':'')+t.getMinutes())
  :(SYNC.state==='err'?'Sync error':(SYNC.state==='busy'?'Syncing...':'Sync off'));
 el.title=msg||'';
}
async function syncPush(){
 var cfg=syncCfg();if(!cfg)return;
 if(SYNC.pin&&syncCryptoOk()){
  var chk=await fetch(cfg.url,{headers:cfg.headers});
  if(chk.ok){
   var cb=await chk.json();
   if(cb&&cb.enc==='aesgcm'){
    var k2=await syncKey(cb.salt);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(cb.iv)},k2,unb64(cb.ct));
   }
  }
 }
 var pl=syncPayload(),body=pl,headers=Object.assign({},cfg.headers);
 if(SYNC.pin&&syncCryptoOk()){
  if(!SYNC.salt){SYNC.salt=b64(crypto.getRandomValues(new Uint8Array(16)));syncPersist();}
  var key=await syncKey(SYNC.salt),iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(pl)));
  body={v:1,enc:'aesgcm',salt:SYNC.salt,iv:b64(iv),ct:b64(new Uint8Array(ct))};
 }
 headers['Content-Type']='application/json';
 var r=await fetch(cfg.url,{method:'PUT',headers:headers,body:JSON.stringify(body)});
 if(!r.ok)throw new Error('HTTP '+r.status);
 SYNC.last=Date.now();SYNC.state='ok';syncStatus();
}
async function syncPull(){
 var cfg=syncCfg();if(!cfg)return;
 var r=await fetch(cfg.url,{headers:cfg.headers});
 if(r.status===404){SYNC.state='ok';syncStatus();return;}
 if(!r.ok)throw new Error('HTTP '+r.status);
 var body=await r.json(),pl=body;
 if(body&&body.enc==='aesgcm'){
  if(!SYNC.pin)throw new Error('PIN needed');
  var key=await syncKey(body.salt);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(body.iv)},key,unb64(body.ct));
  pl=JSON.parse(new TextDecoder().decode(pt));
 }
 if(!pl||!pl.shifts)return;
 var changed=false;
 Object.keys(pl.shifts).forEach(function(k){
  var rem=pl.shifts[k];if(!rem)return;
  var local=SYNC.ts[k]||0;
  if(!local||(rem.ts||0)>local){syncApply(k,rem);SYNC.ts[k]=rem.ts||0;changed=true;}
 });
 if(changed){syncPersist();if(typeof build==='function')build(CUR);if(typeof renderSummary==='function')renderSummary();}
 SYNC.last=Date.now();SYNC.state='ok';syncStatus();
}
function syncErr(e){SYNC.state='err';syncStatus(String(e&&e.message||e));}
var syncTimer=null;
function syncTouch(k){
 if(SYNC.applying)return;
 SYNC.ts[k]=Date.now();syncPersist();
 clearTimeout(syncTimer);syncTimer=setTimeout(function(){SYNC.state='busy';syncStatus();syncPush().catch(syncErr)},1200);
 SYNC.state='busy';syncStatus();
}
/* hook the app's own save so every change is pushed */
(function(){
 if(typeof window.sset!=='function')return;
 var orig=window.sset;
 window.sset=function(k,v){
  var r=orig.apply(this,arguments);
  if(k==='shiftrep_v1'||k==='shiftrep_x1')syncTouch(typeof CUR!=='undefined'?CUR:'A');
  return r;
 };
})();
async function syncNow(){SYNC.state='busy';syncStatus();try{await syncPull();await syncPush();}catch(e){syncErr(e)}}
/* ---------------- sync panel ---------------- */
function syncPanel(){
 if(document.getElementById('syncPanel'))return;
 var d=document.createElement('div');
 d.id='syncPanel';d.className='syncwrap';d.setAttribute('hidden','');
 d.innerHTML='<div class="syncbox"><div class="sbh"><b>Cloud sync</b><button id="syncClose" type="button">&times;</button></div>'+
  '<p class="hint" id="syncHint">Sync is ON - the PIN is already set, you only enter it once per device.<br>Data is encrypted (AES-GCM) before it leaves the device.<br>Want another cloud? Paste a different URL here (Firebase URL, or JSONBin URL|master key).</p>'+
  '<label class="sl">Sync code<textarea id="syncCode" rows="2" spellcheck="false" placeholder="https://PROJECT-default-rtdb.firebaseio.com/lab/SECRET.json  |  https://api.jsonbin.io/v3/b/ID|KEY"></textarea></label>'+
  '<label class="sl">PIN (optional)<input id="syncPin" type="password" inputmode="numeric" placeholder="e.g. 4821"></label>'+
  '<div class="srow"><button id="syncSave" class="cp" type="button">Save &amp; sync</button>'+
  '<button id="syncNow" class="cp" type="button">Sync now</button>'+
  '<button id="syncCopy" class="cp" type="button">Copy code</button></div>'+
  '<div class="hint" id="syncMsg"></div></div>';
 document.body.appendChild(d);
 d.querySelector('#syncClose').onclick=function(){d.setAttribute('hidden','')};
 d.querySelector('#syncCode').value=SYNC.code||DEFCODE;
 d.querySelector('#syncPin').value=SYNC.pin;
 d.querySelector('#syncHint').textContent=SYNC.pin
  ? 'Sync is ON. The PIN is saved on this device - you will not be asked for it again.'
  : 'Sync is OFF. Enter a PIN to encrypt and enable the cloud sync.';
 d.querySelector('#syncSave').onclick=function(){
  SYNC.code=(d.querySelector('#syncCode').value||'').trim()||DEFCODE;
  SYNC.pin=(d.querySelector('#syncPin').value||'').trim();
  if(!SYNC.pin){d.querySelector('#syncMsg').textContent='Enter a PIN - it encrypts your data in the cloud (the same PIN on every device).';return;}
  syncPersist();syncNow();
  d.querySelector('#syncMsg').textContent='Saved. Running first sync...';
 };
 d.querySelector('#syncNow').onclick=function(){syncNow()};
 d.querySelector('#syncCopy').onclick=function(){
  var code=(SYNC.code||DEFCODE)+(SYNC.pin?('|PIN:'+SYNC.pin):'');
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code);
    d.querySelector('#syncMsg').textContent='Copied - paste it on the other device.';}
   else d.querySelector('#syncMsg').textContent='Copy the sync code + PIN manually.';
  }catch(e){d.querySelector('#syncMsg').textContent='Copy the sync code + PIN manually.'}
 };
}
(function(){
 syncLoad();
 var btn=document.getElementById('syncBtn');
 if(btn)btn.onclick=function(){syncPanel();var p=document.getElementById('syncPanel');if(p)p.removeAttribute('hidden')};
 syncStatus();
 if(syncCfg()){
  syncPull().catch(syncErr);
  setInterval(function(){if(!document.hidden)syncPull().catch(syncErr)},45000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)syncPull().catch(syncErr)});
 }
})();
</script>
